name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check:assets
      - run: pnpm build
      - name: Install Playwright (pinned, outside the app lockfile)
        run: npm install --prefix "$RUNNER_TEMP/pw" playwright@1.64.0
      - name: Browser smoke test on software WebGL
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          GAME_URL: http://127.0.0.1:4173/
          SHOT_DIR: artifacts/shots
          SHOT_SIZES: 960x540:desktop
        run: |
          pnpm preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          node scripts/smoke-shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: artifacts/shots
