# Example only: place inside the nginx http {} context and replace the root.
# This repository does not deploy or enable any paid service.
server {
    listen 8080;
    server_name _;
    root /srv/banana-express/dist;
    include mime.types;
    types { model/gltf-binary glb; application/wasm wasm; }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types model/gltf-binary application/json text/javascript application/javascript text/css audio/wav;
    # Optional with --with-http_gzip_static_module: use the build's .gz sidecars.
    # gzip_static on;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
